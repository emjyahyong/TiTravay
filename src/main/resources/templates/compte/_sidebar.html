<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Fragment : sidebar(activeSection)
    Usage   : th:replace="~{compte/_sidebar :: sidebar(activeSection='profil')}"
-->
<aside th:fragment="sidebar(activeSection)" class="compte-sidebar">

    <div class="compte-sidebar__user">
        <div class="compte-sidebar__avatar" th:text="${#authentication.name.substring(0,1).toUpperCase()}">U</div>
        <span class="compte-sidebar__username" th:text="${#authentication.name}">username</span>
    </div>

    <nav class="compte-nav" aria-label="Navigation du compte">

        <a href="/compte/profil"
           class="compte-nav__item"
           th:classappend="${activeSection == 'profil'} ? ' is-active'">
            <svg class="compte-nav__icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            Mon profil
        </a>

        <a href="/compte/securite"
           class="compte-nav__item"
           th:classappend="${activeSection == 'securite'} ? ' is-active'">
            <svg class="compte-nav__icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Sécurité
        </a>

        <a href="/compte/services"
           class="compte-nav__item"
           th:classappend="${activeSection == 'services'} ? ' is-active'">
            <svg class="compte-nav__icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="7" width="20" height="14" rx="2"/>
                <path d="M16 7V5a2 2 0 0 0-4 0v2M8 7V5a2 2 0 0 0-4 0v2"/>
            </svg>
            Mes services
        </a>

    </nav>

    <div class="compte-nav__divider"></div>

    <a href="/compte/profil#danger" class="compte-nav__item compte-nav__item--danger">
        <svg class="compte-nav__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        Zone de danger
    </a>

</aside>

</body>
</html>
