<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — TiTravay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<section class="auth-page">
    <div class="auth-card">

        <div class="auth-card__logo">
            <a href="/home" class="auth-card__logo-text">TiTravay</a>
        </div>

        <h1 class="auth-card__title">Connexion</h1>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <input type="text"
                       id="username"
                       name="username"
                       required
                       autocomplete="username"
                       class="form-input"
                       placeholder="Votre nom d'utilisateur">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password"
                       id="password"
                       name="password"
                       required
                       autocomplete="current-password"
                       class="form-input"
                       placeholder="Votre mot de passe">
            </div>
            <button type="submit" class="btn btn--primary btn--full">
                Se connecter
            </button>
        </form>

        <p th:if="${param.error}"
           class="form-error"
           style="margin-top: var(--space-base);">
            Nom d'utilisateur ou mot de passe invalide.
        </p>
        <p th:if="${param.logout}"
           class="form-success"
           style="margin-top: var(--space-base);">
            Vous avez été déconnecté avec succès.
        </p>

        <div class="auth-card__footer">
            Pas encore de compte ? <a href="/register">S'inscrire</a>
        </div>

    </div>
</section>

</body>
</html>
