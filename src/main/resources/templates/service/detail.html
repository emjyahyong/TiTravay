<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${service.titre} + ' — TiTravay'">Service — TiTravay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: site-header}"></div>
<div th:replace="~{fragments/header :: category-strip}"></div>

<section class="detail-section">
    <div class="container--narrow">
        <div class="detail-grid">

            <!-- ── Colonne gauche : contenu ── -->
            <div class="detail-main">

                <!-- Photo -->
                <div class="detail-main__photo">
                    <img th:if="${service.imageUrl != null and !#strings.isEmpty(service.imageUrl)}"
                         th:src="${service.imageUrl}"
                         th:alt="${service.titre}">
                    <span th:unless="${service.imageUrl != null and !#strings.isEmpty(service.imageUrl)}">
                        Aucune photo disponible
                    </span>
                </div>

                <!-- Catégorie + Titre + Méta -->
                <p class="detail-main__category" th:text="${service.categorie}">Catégorie</p>
                <h1 class="detail-main__title"   th:text="${service.titre}">Titre du service</h1>

                <div class="detail-main__meta">
                    <span>📍 <span th:text="${service.localisation}">Localisation</span></span>
                    <span class="detail-main__meta-sep">·</span>
                    <span>Publié le <span th:text="${dateFormatee}">Date</span></span>
                </div>

                <div class="detail-main__divider"></div>

                <!-- Description -->
                <h2 class="detail-main__section-title">Description</h2>
                <p class="detail-main__description" th:text="${service.description}">
                    Description du service ici.
                </p>

            </div>

            <!-- ── Colonne droite : carte de contact ── -->
            <aside>
                <div class="contact-card">

                    <!-- Prix -->
                    <p class="contact-card__price">
                        <span th:text="${service.prix + ' €'}">Prix</span>
                        <span>/h</span>
                    </p>

                    <!-- Prestataire -->
                    <div class="contact-card__author">
                        <div class="author-avatar">
                            <span th:text="${service.auteur != null
                                            ? service.auteur.username.substring(0,1).toUpperCase()
                                            : '?'}">A</span>
                        </div>
                        <div>
                            <p class="author-name"
                               th:text="${service.auteur != null ? service.auteur.username : 'Utilisateur introuvable'}">
                                Nom utilisateur
                            </p>
                            <p class="author-label">Prestataire</p>
                        </div>
                    </div>

                    <!-- CTA conversation -->
                    <button id="btnConv"
                            th:attr="data-id=${service.id}"
                            class="btn btn--primary btn--full">
                        Contacter le prestataire
                    </button>

                    <p class="contact-card__note">Paiement sécurisé non disponible</p>

                </div>
            </aside>

        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: site-footer}"></div>

<script>
    document.getElementById('btnConv').addEventListener('click', function () {
        const btn      = this;
        const serviceId = btn.getAttribute('data-id');
        const token    = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const header   = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        if (!token || !header) return;

        btn.disabled    = true;
        btn.textContent = 'Chargement…';

        fetch('/api/conversations/service/' + serviceId, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [header]: token
            }
        })
        .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(function (data) {
            window.location.href = '/conversations/' + data.id;
        })
        .catch(function (err) {
            console.error('Erreur :', err);
            btn.disabled    = false;
            btn.textContent = 'Contacter le prestataire';
            alert('Une erreur est survenue. Veuillez réessayer.');
        });
    });
</script>

</body>
</html>
