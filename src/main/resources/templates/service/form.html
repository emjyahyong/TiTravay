<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposer un service — TiTravay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: site-header}"></div>

<main class="form-page">
    <div class="form-card">

        <h1 class="form-card__title">Proposer un service</h1>
        <p class="form-card__subtitle">
            Partagez vos compétences avec la communauté martiniquaise.
        </p>

        <form th:action="@{/services/add}"
              th:object="${service}"
              method="post"
              class="form-stack">

            <div class="form-group">
                <label for="titre" class="form-label">Titre du service</label>
                <input type="text"
                       id="titre"
                       th:field="*{titre}"
                       required
                       class="form-input"
                       placeholder="Ex : Cours de mathématiques niveau lycée">
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Description</label>
                <textarea id="description"
                          th:field="*{description}"
                          class="form-input form-textarea"
                          placeholder="Décrivez votre service, votre expérience, vos disponibilités…"></textarea>
            </div>

            <div class="form-group">
                <label for="prix" class="form-label">Tarif horaire (€/h)</label>
                <input type="number"
                       id="prix"
                       th:field="*{prix}"
                       step="0.01"
                       min="0"
                       required
                       class="form-input"
                       placeholder="Ex : 25">
            </div>

            <div class="form-group">
                <label for="localisation" class="form-label">Commune</label>
                <input type="text"
                       id="localisation"
                       th:field="*{localisation}"
                       required
                       class="form-input"
                       placeholder="Ex : Fort-de-France">
            </div>

            <div class="form-group">
                <label for="imageUrl" class="form-label">URL de la photo (optionnel)</label>
                <input type="url"
                       id="imageUrl"
                       th:field="*{imageUrl}"
                       class="form-input"
                       placeholder="https://…">
            </div>

            <div class="form-group">
                <label for="categorie" class="form-label">Catégorie</label>
                <select id="categorie"
                        th:field="*{categorie}"
                        required
                        class="form-input form-select">
                    <option value="">Choisissez une catégorie</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat}"
                            th:text="${cat}">Catégorie</option>
                </select>
            </div>

            <div class="form-actions">
                <a href="/home" class="btn btn--secondary">Annuler</a>
                <button type="submit" class="btn btn--primary">Publier mon service</button>
            </div>

        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: site-footer}"></div>

</body>
</html>
