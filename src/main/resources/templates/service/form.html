<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un service</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="bg-gray-100 p-6">
<div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-md">
    <h1 class="text-2xl font-semibold mb-6 text-center">Ajouter un service</h1>

    <form th:action="@{/services/add}" th:object="${service}" method="post" class="space-y-4">
        <div>
            <label class="block text-gray-700">Titre</label>
            <input type="text" th:field="*{titre}" class="w-full p-2 border border-gray-300 rounded-xl">
        </div>

        <div>
            <label class="block text-gray-700">Description</label>
            <textarea th:field="*{description}" class="w-full p-2 border border-gray-300 rounded-xl" rows="4"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700">Prix (€)</label>
                <input type="number" step="0.01" th:field="*{prix}" class="w-full p-2 border border-gray-300 rounded-xl">
            </div>

            <div>
                <label class="block text-gray-700">Localisation</label>
                <input type="text" th:field="*{localisation}" class="w-full p-2 border border-gray-300 rounded-xl">
            </div>
        </div>

        <div>
            <label class="block text-gray-700">URL de l'image</label>
            <input type="text" th:field="*{imageUrl}" class="w-full p-2 border border-gray-300 rounded-xl">
        </div>

        <div>
            <label class="block text-gray-700">Catégorie</label>
            <select th:field="*{categorie}" class="w-full p-2 border border-gray-300 rounded-xl">
                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Catégorie</option>
            </select>
        </div>

        <div class="flex justify-end">
            <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-xl shadow">
                Publier
            </button>
        </div>
    </form>
</div>
</body>
</html>
