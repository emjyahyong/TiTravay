<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un service - TiTravay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<section style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #F8FAFC;">
    <div style="background: white; padding: 40px; border-radius: var(--border-radius); box-shadow: var(--box-shadow); width: 100%; max-width: 600px;">
        <h2 style="font-size: 24px; font-weight: 700; color: var(--primary-color); margin-bottom: 24px; text-align: center;">Ajouter un service</h2>

        <form th:action="@{/services/add}" th:object="${service}" method="post" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label for="titre" style="display: block; font-weight: 600; margin-bottom: 8px;">Titre</label>
                <input type="text" id="titre" th:field="*{titre}" required style="width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: var(--border-radius);">
            </div>

            <div>
                <label for="description" style="display: block; font-weight: 600; margin-bottom: 8px;">Description</label>
                <textarea id="description" th:field="*{description}" rows="4" style="width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: var(--border-radius);"></textarea>
            </div>

            <div>
                <label for="prix" style="display: block; font-weight: 600; margin-bottom: 8px;">Prix (€)</label>
                <input type="number" id="prix" th:field="*{prix}" step="0.01" required style="width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: var(--border-radius);">
            </div>

            <div>
                <label for="localisation" style="display: block; font-weight: 600; margin-bottom: 8px;">Localisation</label>
                <input type="text" id="localisation" th:field="*{localisation}" required style="width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: var(--border-radius);">
            </div>

            <div>
                <label for="imageUrl" style="display: block; font-weight: 600; margin-bottom: 8px;">URL de l'image</label>
                <input type="text" id="imageUrl" th:field="*{imageUrl}" style="width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: var(--border-radius);">
            </div>

            <div>
                <label for="categorie" style="display: block; font-weight: 600; margin-bottom: 8px;">Catégorie</label>
                <select id="categorie" th:field="*{categorie}" required style="width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: var(--border-radius);">
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Catégorie</option>
                </select>
            </div>

            <button type="submit" class="post-button" style="width: 100%;">Publier</button>
        </form>
    </div>
</section>
</body>
</html>
