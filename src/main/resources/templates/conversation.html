<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Messages — TiTravay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="conversation-page">

<!-- En-tête du chat -->
<header class="chat-header">
    <a href="/home" class="chat-header__back" aria-label="Retour">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
    </a>
    <div class="chat-header__avatar" id="headerAvatar">?</div>
    <div class="chat-header__info">
        <p class="chat-header__name"   id="headerName">Conversation</p>
        <p class="chat-header__status" id="headerStatus">Connexion…</p>
    </div>
</header>

<!-- Zone de messages -->
<div id="chatBox" class="chat-messages" role="log" aria-live="polite" aria-label="Messages"></div>

<!-- Barre de saisie -->
<div class="chat-input-bar">
    <input id="messageInput"
           class="chat-input-bar__field"
           type="text"
           placeholder="Écris un message…"
           autocomplete="off"
           aria-label="Votre message">
    <button id="sendBtn" class="chat-input-bar__send" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
    </button>
</div>

<!-- Librairies WebSocket -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<!-- Variables Thymeleaf injectées en JS -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const CONV_ID      = /*[[${conversationId}]]*/ 0;
    const CURRENT_USER = /*[['${currentUser.username}']]*/ 'anonymous';
    /*]]>*/
</script>

<script>
    const CSRF_TOKEN  = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const CSRF_HEADER = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

    // ── Connexion STOMP ──────────────────────────────────────
    const stompClient = Stomp.over(new SockJS('/ws'));
    stompClient.debug = null; // silence les logs en dev

    stompClient.connect({}, function () {
        document.getElementById('headerStatus').textContent = 'En ligne';

        // Erreurs renvoyées par ChatWebSocketController (@SendToUser)
        stompClient.subscribe('/user/queue/errors', function (frame) {
            showToast(frame.body, true);
        });

        // Nouveaux messages diffusés sur le topic de la conversation
        stompClient.subscribe('/topic/conversations/' + CONV_ID, function (frame) {
            renderMessage(JSON.parse(frame.body));
        });

        // Charger l'historique puis marquer comme lus
        loadHistory().then(markRead);

    }, function (error) {
        document.getElementById('headerStatus').textContent = 'Déconnecté — rechargez la page';
        showToast('Connexion perdue. Veuillez recharger la page.', true);
        console.error('STOMP error :', error);
    });

    // ── Chargement de l'historique ───────────────────────────
    async function loadHistory() {
        try {
            const res = await fetch('/api/conversations/' + CONV_ID + '/messages?page=0&size=50');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const page = await res.json();
            page.content.forEach(function (msg) { renderMessage(msg); });
        } catch (err) {
            console.warn('Impossible de charger l\'historique :', err.message);
        }
    }

    // ── Marquer les messages comme lus ───────────────────────
    function markRead() {
        if (!CSRF_TOKEN || !CSRF_HEADER) return;
        fetch('/api/conversations/' + CONV_ID + '/read', {
            method:  'PATCH',
            headers: { [CSRF_HEADER]: CSRF_TOKEN }
        }).catch(function () { /* fire-and-forget, non bloquant */ });
    }

    // ── Rendu d'un message ───────────────────────────────────
    function renderMessage(msg) {
        // msg.senderUsername provient de MessageResponse (REST ou WebSocket)
        var isMine  = msg.senderUsername === CURRENT_USER;
        var chatBox = document.getElementById('chatBox');

        // Mise à jour du nom/avatar dans le header au premier message reçu
        if (!isMine) {
            var avatar = document.getElementById('headerAvatar');
            var name   = document.getElementById('headerName');
            if (avatar.textContent === '?') {
                avatar.textContent = msg.senderUsername.charAt(0).toUpperCase();
                name.textContent   = msg.senderUsername;
            }
        }

        var wrap = document.createElement('div');
        wrap.className = 'chat-bubble-wrap ' +
                         (isMine ? 'chat-bubble-wrap--mine' : 'chat-bubble-wrap--theirs');

        if (!isMine) {
            var sender = document.createElement('p');
            sender.className  = 'chat-bubble__sender';
            sender.textContent = msg.senderUsername; // textContent : pas d'injection HTML
            wrap.appendChild(sender);
        }

        var bubble = document.createElement('div');
        bubble.className  = 'chat-bubble ' +
                            (isMine ? 'chat-bubble--mine' : 'chat-bubble--theirs');
        bubble.textContent = msg.content; // textContent : pas d'injection HTML
        wrap.appendChild(bubble);

        chatBox.appendChild(wrap);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // ── Envoi d'un message ───────────────────────────────────
    function sendMessage() {
        var input   = document.getElementById('messageInput');
        var content = input.value.trim();
        if (!content) return;

        // Payload JSON correspondant à SendMessageRequest { content }
        stompClient.send('/app/chat/' + CONV_ID, {}, JSON.stringify({ content: content }));
        input.value = '';
        input.focus();
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ── Toast de notification ────────────────────────────────
    function showToast(message, isError) {
        var toast = document.createElement('div');
        toast.style.cssText =
            'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);' +
            'background:' + (isError ? '#c13515' : '#222222') + ';color:#fff;' +
            'padding:8px 16px;border-radius:8px;font-size:14px;z-index:999;' +
            'max-width:320px;text-align:center;';
        toast.textContent = message; // textContent : pas d'injection HTML
        document.body.appendChild(toast);
        setTimeout(function () { toast.remove(); }, 4000);
    }
</script>

</body>
</html>
