<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — TiTravay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="conversation-page">

<!-- En-tête du chat -->
<header class="chat-header">
    <a href="/home" class="chat-header__back" aria-label="Retour à l'accueil">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
    </a>
    <div class="chat-header__avatar" id="headerAvatar">?</div>
    <div class="chat-header__info">
        <p class="chat-header__name"   id="headerName">Conversation</p>
        <p class="chat-header__status" id="headerStatus">Connexion…</p>
    </div>
</header>

<!-- Zone de messages -->
<div id="chatBox" class="chat-messages" role="log" aria-live="polite"></div>

<!-- Barre de saisie -->
<div class="chat-input-bar">
    <input id="messageInput"
           class="chat-input-bar__field"
           type="text"
           placeholder="Écris un message…"
           autocomplete="off"
           aria-label="Votre message">
    <button id="sendBtn" class="chat-input-bar__send" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
    </button>
</div>

<!-- Librairies WebSocket -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<!-- Variables Thymeleaf → JS -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const CONV_ID      = /*[[${conversationId}]]*/ 0;
    const CURRENT_USER = /*[['${currentUser.username}']]*/ 'anonymous';
    /*]]>*/
</script>

<script>
    // ── Connexion WebSocket ──────────────────────────────────
    const socket      = new SockJS('/ws');
    const stompClient = Stomp.over(socket);
    stompClient.debug = null; // silence les logs STOMP en prod

    stompClient.connect({}, function () {
        document.getElementById('headerStatus').textContent = 'En ligne';

        stompClient.subscribe('/topic/conversations/' + CONV_ID, function (frame) {
            appendMessage(JSON.parse(frame.body));
        });
    }, function () {
        document.getElementById('headerStatus').textContent = 'Déconnecté';
    });

    // ── Affichage d'un message ───────────────────────────────
    function appendMessage(msg) {
        const isMine = msg.sender.username === CURRENT_USER;
        const chatBox = document.getElementById('chatBox');

        // Met à jour l'avatar / nom dans le header si ce n'est pas nous
        if (!isMine) {
            const avatar = document.getElementById('headerAvatar');
            const name   = document.getElementById('headerName');
            if (avatar.textContent === '?') {
                avatar.textContent = msg.sender.username.charAt(0).toUpperCase();
                name.textContent   = msg.sender.username;
            }
        }

        const wrap   = document.createElement('div');
        wrap.className = 'chat-bubble-wrap ' +
                         (isMine ? 'chat-bubble-wrap--mine' : 'chat-bubble-wrap--theirs');

        if (!isMine) {
            const sender   = document.createElement('p');
            sender.className  = 'chat-bubble__sender';
            sender.textContent = msg.sender.username;
            wrap.appendChild(sender);
        }

        const bubble   = document.createElement('div');
        bubble.className  = 'chat-bubble ' +
                            (isMine ? 'chat-bubble--mine' : 'chat-bubble--theirs');
        bubble.textContent = msg.content;
        wrap.appendChild(bubble);

        chatBox.appendChild(wrap);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // ── Envoi d'un message ───────────────────────────────────
    function sendMessage() {
        const input   = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content) return;

        stompClient.send('/app/chat/' + CONV_ID, {}, JSON.stringify({
            sender:  { username: CURRENT_USER },
            content: content
        }));

        input.value = '';
        input.focus();
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>

</body>
</html>
