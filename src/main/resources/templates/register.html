<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — TiTravay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<section class="auth-page">
    <div class="auth-card">

        <div class="auth-card__logo">
            <a href="/home" class="auth-card__logo-text">TiTravay</a>
        </div>

        <h1 class="auth-card__title">Créer un compte</h1>

        <form th:action="@{/register}" method="post" class="auth-form">
            <div class="form-group">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <input type="text"
                       id="username"
                       name="username"
                       required
                       autocomplete="username"
                       class="form-input"
                       placeholder="Choisissez un nom d'utilisateur">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password"
                       id="password"
                       name="password"
                       required
                       autocomplete="new-password"
                       class="form-input"
                       placeholder="Choisissez un mot de passe">
            </div>
            <div class="form-group">
                <label for="role" class="form-label">Type de compte</label>
                <select name="role" id="role" class="form-input form-select">
                    <option value="ROLE_USER">Utilisateur</option>
                    <option value="ROLE_ADMIN">Administrateur</option>
                </select>
            </div>
            <button type="submit" class="btn btn--primary btn--full">
                Créer mon compte
            </button>
        </form>

        <p th:if="${error}"
           class="form-error"
           style="margin-top: var(--space-base);"
           th:text="${error}">Erreur</p>

        <div class="auth-card__footer">
            Déjà un compte ? <a href="/login">Se connecter</a>
        </div>

    </div>
</section>

</body>
</html>
